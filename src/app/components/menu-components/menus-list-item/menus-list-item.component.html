@if (menu) {
  <article class="order-row">
    <div class="order-main">
      @if(menu.temporary){
        <div>
          <span class="eyebrow">Об`єднано з дат</span>
          <h2>{{menu.client}}</h2>
        </div>
      }@else{
        <div>
          <span class="eyebrow">Дата події</span>
          <h2>{{menu.date}}</h2>
          @if(menu.client && menu.client.trim()){
            <p class="client-name">{{menu.client}}</p>
          }
        </div>
      }


      <div class="order-price">
        <span class="eyebrow">Сума</span>
        <strong>{{menu.totalPrice}} грн</strong>
      </div>
      <button
        mat-icon-button
        class="paid-button"
        [ngClass]="menu.payed ? 'full' : 'empty'"
        (click)="toggleFavourite()"
        [attr.aria-label]="menu.payed ? 'Позначено як оплачено' : 'Позначити як оплачено'"
        [title]="menu.payed ? 'Оплачено' : 'Не оплачено'">
        <mat-icon>{{menu.payed ? 'paid' : 'payments'}}</mat-icon>
      </button>
    </div>

    <div class="control-buttons" aria-label="Дії із замовленням">
      <button
        mat-stroked-button
        class="control-button pdf-button"
        [disabled]="loadingPdfType !== null"
        [matMenuTriggerFor]="pdfMenu">
        @if (loadingPdfType === null) {
          <span class="pdf-button-content">
            <mat-icon>download</mat-icon>
            <span>PDF</span>
            <mat-icon>expand_more</mat-icon>
          </span>
        } @else {
          <span class="pdf-button-content">
            <span class="button-spinner" aria-hidden="true"></span>
            <span class="pdf-loading-text">Генерується...</span>
          </span>
        }
      </button>
      <mat-menu #pdfMenu="matMenu">
        <button mat-menu-item [disabled]="loadingPdfType !== null" (click)="downloadMenu(menu.id)">
          @if (loadingPdfType === 'menu') {
            <span class="menu-spinner" aria-hidden="true"></span>
          } @else {
            <mat-icon>description</mat-icon>
          }
          <span>{{ loadingPdfType === 'menu' ? 'Генерується PDF меню...' : 'PDF меню' }}</span>
        </button>
        <button mat-menu-item [disabled]="loadingPdfType !== null" (click)="downloadShoppingList(menu.id)">
          @if (loadingPdfType === 'shopping') {
            <span class="menu-spinner" aria-hidden="true"></span>
          } @else {
            <mat-icon>shopping_bag</mat-icon>
          }
          <span>{{ loadingPdfType === 'shopping' ? 'Генерується список закупівлі...' : 'Список закупівлі' }}</span>
        </button>
      </mat-menu>
      <button mat-stroked-button class="control-button" routerLinkActive [routerLink]="['/service/orders/new']" [queryParams]="{orderId:menu.id}">
        <mat-icon>edit</mat-icon>
        <span>Редагувати</span>
      </button>
      <button mat-icon-button class="shopping-button" aria-label="Закупівлі" title="Закупівлі" [routerLink]="['/service/orders', menu.id, 'shopping']">
        <mat-icon>shopping_cart</mat-icon>
      </button>
      <button mat-icon-button class="copy-button" aria-label="Копіювати" title="Копіювати" (click)="copyMenu(menu.id)">
        <mat-icon>content_copy</mat-icon>
      </button>
      <button mat-icon-button class="delete-button" aria-label="Видалити" title="Видалити" (click)="openDeleteDialog()">
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  </article>
}
