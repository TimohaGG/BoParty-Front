<div class="bo-dialog waiter-dialog">
  <header class="bo-dialog-header">
    <h2>{{isEditMode ? 'Редагувати працівника' : 'Додати працівника'}}</h2>
    <p>{{isEditMode ? 'Оновіть імʼя та тип працівника.' : 'Додайте нового працівника для витрат.'}}</p>
  </header>

  <mat-dialog-content class="bo-dialog-content">
    <mat-form-field>
      <mat-label>Імʼя</mat-label>
      <input matInput [formControl]="name" type="text" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Тип</mat-label>
      <mat-select [formControl]="type">
        @for(item of staffTypes; track item.value){
          <mat-option [value]="item.value">{{item.label}}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions class="bo-dialog-actions">
    <button mat-button mat-dialog-close>Скасувати</button>
    <button mat-flat-button color="accent" (click)="save()">{{isEditMode ? 'Зберегти' : 'Додати'}}</button>
  </mat-dialog-actions>
</div>
