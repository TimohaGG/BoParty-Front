<section class="page-shell waiters-page">
  <header class="page-header waiters-header">
    <div>
      <h1 class="page-title">Персонал</h1>
      <p class="page-subtitle">Список працівників, яких можна додавати до витрат і статистики.</p>
    </div>

    <button mat-flat-button color="accent" type="button" [disabled]="saving" (click)="openCreateDialog()">
      @if(saving){
        <mat-spinner diameter="20"></mat-spinner>
      }
      @else{
        <mat-icon>add</mat-icon>
      }
      Додати
    </button>
  </header>

  @if(loading){
    <div class="content-panel waiters-state">
      <mat-spinner diameter="42"></mat-spinner>
    </div>
  }
  @else if(staff.length === 0){
    <div class="content-panel waiters-state">
      <mat-icon>group</mat-icon>
      <span>Працівників ще немає.</span>
    </div>
  }
  @else{
    <div class="content-panel waiters-list">
      @for(staffItem of staff; track staffItem.id){
        <article class="waiter-row">
          <div class="waiter-avatar">
            <mat-icon>person</mat-icon>
          </div>

          <div class="waiter-main">
            <h2>{{staffItem.name}}</h2>
            <span>{{getStaffTypeLabel(staffItem.type)}} · ID {{staffItem.id}}</span>
          </div>

          <div class="waiter-actions">
            <button mat-icon-button type="button" [disabled]="saving || isDeleting(staffItem)" (click)="openEditDialog(staffItem)" aria-label="Редагувати працівника">
              <mat-icon>edit</mat-icon>
            </button>

            <button mat-icon-button type="button" class="danger-button" [disabled]="saving || isDeleting(staffItem)" (click)="deleteWaiter(staffItem)" aria-label="Видалити працівника">
              @if(isDeleting(staffItem)){
                <mat-spinner diameter="20"></mat-spinner>
              }
              @else{
                <mat-icon>delete_outline</mat-icon>
              }
            </button>
          </div>
        </article>
      }
    </div>
  }
</section>
